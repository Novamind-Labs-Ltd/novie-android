<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow-x: hidden; }
    #diagram { width: 100%; display: flex; justify-content: center; }
    #diagram svg { width: 100%; max-width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div id="diagram" aria-label="Diagram"></div>
  <script>
    function showDiagram(svg) {
      document.getElementById("diagram").innerHTML = svg;
    }
  </script>
</body>
</html>
